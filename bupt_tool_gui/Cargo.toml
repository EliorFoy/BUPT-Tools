[package]
name = "bupt_tool_gui"
version = "1.0.0"
edition = "2021"
authors = ["BUPT Tool Team"]
description = "A cross-platform GUI tool for BUPT course registration, built with Rust and Slint"

[dependencies]
slint = "1.6"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "cookies", "gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
cookie = "0.18"
scraper = "0.19"
regex = "1.10"

[build-dependencies]
slint-build = "1.6"

[[bin]]
name = "bupt_tool_gui"
path = "src/main.rs"
